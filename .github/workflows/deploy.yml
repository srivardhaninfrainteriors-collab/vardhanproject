name: Deploy website to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_LEAD_API_URL: ${{ vars.LEAD_API_URL }}
          VITE_GA4_ID: ${{ vars.GA4_ID }}
          VITE_GTM_ID: ${{ vars.GTM_ID }}
          VITE_META_PIXEL_ID: ${{ vars.META_PIXEL_ID }}
          VITE_GOOGLE_ADS_ID: ${{ vars.GOOGLE_ADS_ID }}
          VITE_GOOGLE_ADS_CONVERSION_LABEL: ${{ vars.GOOGLE_ADS_CONVERSION_LABEL }}
      - run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
